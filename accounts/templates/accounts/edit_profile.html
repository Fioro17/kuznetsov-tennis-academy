{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}
Edit Profile | Kuznetsov Tennis Academy
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="auth-card">

            <p class="hero-eyebrow">
                Account Settings
            </p>

            <h1>
                Edit Profile
            </h1>

            <form method="post" enctype="multipart/form-data">

                {% csrf_token %}

                {% bootstrap_form user_form %}
                {% bootstrap_form profile_form %}

                <button
                    type="submit"
                    class="btn hero-primary-button w-100"
                >
                    Save Changes
                </button>

            </form>

            <a
                href="{% url 'profile' %}"
                class="btn hero-secondary-button w-100 mt-2"
            >
                Cancel
            </a>

        </div>

    </div>

</section>

{% endblock %}
