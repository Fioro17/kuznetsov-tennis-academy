{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Create Account | KTA{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <p class="hero-eyebrow">Membership</p>
            <h1>Create Your Account</h1>

            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}

                <button type="submit" class="btn hero-primary-button w-100">
                    Create Account
                </button>
            </form>

            <p class="auth-link">
                Already a member?
                <a href="{% url 'login' %}">Log in</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
